version: "3.8"

services:
  stellar-quickstart:
    image: stellar/quickstart:latest
    ports:
      - "8000:8000"
    command:
      - "--standalone"
      - "--enable-soroban-rpc"
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:8000/soroban/rpc"]
      interval: 5s
      timeout: 5s
      retries: 20
